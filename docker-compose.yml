services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: food_ai
      POSTGRES_USER: food_ai
      POSTGRES_PASSWORD: food_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food_ai -d food_ai"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [ai_net]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [ai_net]

  ai-api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://food_ai:food_ai@postgres:5432/food_ai
      REDIS_URL: redis://redis:6379/0
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers"]
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    networks: [ai_net]

volumes:
  postgres_data:
  redis_data:
networks:
  ai_net:
    driver: bridge
